[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-aware-ai-coding-orchestrator"
version = "0.1.0"
description = "Controlled local workflow engine for cost-aware AI coding tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["coding_orchestrator*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
exclude = ["build/"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
