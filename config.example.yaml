repo_path: "."
state_path: "logs/state.json"
log_path: "logs/orchestrator.jsonl"

model_routing:
  trivial: "deterministic"
  simple: "opencode-local"
  medium: "opencode-coding"
  hard: "codex-reviewer-placeholder"
  critical: "human-approval"

timeouts:
  max_task_runtime_seconds: 600
  max_attempt_runtime_seconds: 300
  max_total_runtime_seconds: 3600

retries:
  max_retries: 1

budget:
  max_task_cost_usd: 0.10
  max_project_cost_usd: 5.0
  stop_threshold_ratio: 0.9
  ledger_path: "logs/budget.sqlite"
  project_id: "default"
  project_total_budget_usd: 5.0
  cheap_builder_budget_usd: 3.0
  expensive_reviewer_budget_usd: 1.0
  emergency_budget_usd: 1.0

limits:
  max_input_tokens_per_call: 32000
  max_output_tokens_per_call: 4000
  max_context_chars_per_call: 128000
  max_retry_context_chars: 8000
  max_patch_bytes: 256000
  max_stdout_bytes: 256000
  max_stderr_bytes: 64000
  max_validation_output_bytes: 64000
  context_over_limit_policy: "reject"
  output_over_limit_policy: "reject"
  validation_output_over_limit_policy: "truncate"

# Sample prices are placeholders for local planning only.
# Audit and update these values before real paid usage.
pricing:
  roles:
    cheap_builder:
      provider: "opencode"
      model: "opencode-local"
      input_usd_per_1m_tokens: 0.10
      output_usd_per_1m_tokens: 0.40
      max_output_tokens: 4000
      budget_pool: "cheap_builder"
    expensive_reviewer:
      provider: "placeholder"
      model: "frontier-reviewer-placeholder"
      input_usd_per_1m_tokens: 5.00
      output_usd_per_1m_tokens: 15.00
      max_output_tokens: 1500
      budget_pool: "expensive_reviewer"

validation:
  max_files_changed: 5
  forbidden_paths:
    - "/etc/"
    - "~/.ssh"
    - ".env"
    - "secrets"
    - "credentials"
    - "tokens"
  default_commands:
    - "ruff check ."
    - "mypy ."
    - "pytest"

tool_permissions:
  allowlisted_shell_commands:
    - "git"
    - "pytest"
    - "ruff"
    - "mypy"
    - "python"
    - "python3"
  require_approval_for_delete: true

opencode:
  enabled: false
  dry_run: true
  executable: "opencode"
  default_model: "opencode-local"
  max_runtime_seconds: 300
  output_mode: "unified_diff"
  allowed_env_vars: []
  extra_args: []
  missing_install_note: "OpenCode is not installed or not on PATH. Install and authenticate OpenCode, then set opencode.enabled=true and opencode.dry_run=false."

git:
  require_clean_worktree: false
  preserve_untracked_dirs:
    - "logs"
    - ".cache"
    - ".pytest_cache"
    - ".mypy_cache"
    - ".ruff_cache"
  preserve_untracked_files:
    - ".gitignore"
