schema_version: 3
repo_path: "."
state_path: "logs/state.json"
log_path: "logs/orchestrator.jsonl"
# All of the above (plus budget.ledger_path) are resolved relative to repo_path,
# never the process's current working directory, and are always excluded from
# git checkpoint/stash/clean regardless of the target repo's own .gitignore.
escalations_path: "logs/escalations"

providers:
  openai:
    enabled: true
    runtime_enabled: false
    api_key_env_var: "OPENAI_API_KEY"
    base_url: null
    request_timeout_seconds: 300
    # SDK-level retries for transient errors (rate limits/timeouts/connection
    # errors), all still on the Flex tier -- see inference.builder_service_tier
    # below for the orchestrator's own bounded Flex-only retry policy on top of
    # this. Conservative but non-zero by default.
    max_retries: 2

model_aliases:
  # Simplified 2026-08-07 to the 3-model Flex policy (gpt-5-nano/gpt-5-mini/gpt-5).
  # openai_nano (gpt-5.4-nano), openai_mini (gpt-5.4-mini), openai_frontier_balanced
  # (gpt-5.4), openai_frontier (gpt-5.5), and openai_frontier_pro (gpt-5.5-pro) were
  # removed once every automatic/reviewer role was retargeted off of them -- see
  # docs/OPERATIONAL_HARDENING_CHANGES.md for the benchmark that justified this.
  openai_classifier_nano: "gpt-5-nano"
  openai_mini_legacy: "gpt-5-mini"
  openai_codex: "gpt-5.3-codex"
  openai_legacy_reasoning: "gpt-5"
  openai_non_reasoning: "gpt-4.1"

model_roles:
  roles:
    mechanical_worker:
      # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.4-nano to
      # gpt-5-nano -- see docs/OPERATIONAL_HARDENING_CHANGES.md for the benchmark.
      provider: openai
      model_alias: openai_classifier_nano
      purpose: tiny deterministic coding tasks
      max_input_tokens: 16000
      max_output_tokens: 1500
      max_context_chars: 64000
      reasoning_effort: low
      verbosity: low
      structured_output: true
      allow_tools: false
      allow_direct_patch: true
      budget_pool: worker
      default_service_tier: flex
      fallback_service_tier: null  # no automatic fallback -- Flex-only policy
      max_attempts: 2
      manual_approval_required: false
    classification_worker:
      # reasoning_effort="none" was live-verified 2026-08-07 to be REJECTED by the
      # real API for every gpt-5-family model ("Unsupported value: 'none' is not
      # supported ... Supported values are: 'minimal', 'low', 'medium', and
      # 'high'."). "low" is the cheapest value the live API actually accepts.
      provider: openai
      model_alias: openai_classifier_nano
      purpose: classification and summarization only
      max_input_tokens: 12000
      max_output_tokens: 1000
      max_context_chars: 48000
      reasoning_effort: low
      verbosity: low
      structured_output: true
      allow_tools: false
      allow_direct_patch: false
      budget_pool: worker
      default_service_tier: flex
      fallback_service_tier: null  # no automatic fallback -- Flex-only policy
      max_attempts: 2
      manual_approval_required: false
    simple_builder:
      # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.4-mini to
      # gpt-5-mini.
      provider: openai
      model_alias: openai_mini_legacy
      purpose: small local python patches
      max_input_tokens: 32000
      max_output_tokens: 3000
      max_context_chars: 128000
      reasoning_effort: low
      verbosity: low
      structured_output: true
      allow_tools: false
      allow_direct_patch: true
      budget_pool: builder
      default_service_tier: flex
      fallback_service_tier: null  # no automatic fallback -- Flex-only policy
      max_attempts: 2
      manual_approval_required: false
    general_builder:
      # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.4-mini to
      # gpt-5-mini; reasoning_effort raised to "medium" per the benchmarked config.
      provider: openai
      model_alias: openai_mini_legacy
      purpose: normal implementation and repair
      max_input_tokens: 64000
      max_output_tokens: 6000
      max_context_chars: 256000
      reasoning_effort: medium
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: true
      budget_pool: builder
      default_service_tier: flex
      fallback_service_tier: null  # no automatic fallback -- Flex-only policy
      max_attempts: 2
      manual_approval_required: false
    coding_optimized_builder:
      # gpt-5.3-codex (openai_codex) does NOT support Flex -- live-verified
      # 2026-08-07: the API rejects service_tier="flex" for this model with "Flex is
      # not available for this model." Simplified 2026-08-07 to the 3-model policy:
      # retargeted to gpt-5 (openai_legacy_reasoning), which is Flex-capable, so this
      # role stays reachable through automatic routing under the strict Flex-only
      # policy.
      provider: openai
      model_alias: openai_legacy_reasoning
      purpose: coding-optimized patch generation (retargeted from gpt-5.3-codex)
      max_input_tokens: 64000
      max_output_tokens: 8000
      max_context_chars: 256000
      reasoning_effort: medium
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: true
      budget_pool: builder
      default_service_tier: flex
      fallback_service_tier: null
      max_attempts: 2
      manual_approval_required: false
    frontier_coding_reviewer:
      # gpt-5.3-codex does NOT support Flex (live-verified 2026-08-07: rejected with
      # "Flex is not available for this model."). Kept on codex intentionally for
      # its coding-specialized review quality, but live_calls_disabled=true means
      # this role can NEVER make a real API call -- analysis/configuration-only.
      # There is no override that can change this.
      provider: openai
      model_alias: openai_codex
      purpose: difficult coding diagnosis (disabled for all live calls, no Flex support)
      max_input_tokens: 128000
      max_output_tokens: 8000
      max_context_chars: 400000
      reasoning_effort: high
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: false
      budget_pool: reviewer
      default_service_tier: default
      fallback_service_tier: null
      max_attempts: 1
      manual_approval_required: false
      live_calls_disabled: true
    frontier_balanced_reviewer:
      # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.4 to
      # gpt-5 (openai_legacy_reasoning), reasoning_effort raised to "high" -- both
      # live-verified Flex-capable/accepted 2026-08-07.
      provider: openai
      model_alias: openai_legacy_reasoning
      purpose: architecture-lite and large-context review
      max_input_tokens: 256000
      max_output_tokens: 6000
      max_context_chars: 1000000
      reasoning_effort: high
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: false
      budget_pool: reviewer
      default_service_tier: flex
      fallback_service_tier: null
      max_attempts: 1
      manual_approval_required: false
    frontier_reviewer:
      # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.5 to
      # gpt-5 (openai_legacy_reasoning), reasoning_effort raised to "high" -- both
      # live-verified Flex-capable/accepted 2026-08-07.
      provider: openai
      model_alias: openai_legacy_reasoning
      purpose: architecture and difficult diagnosis
      max_input_tokens: 256000
      max_output_tokens: 8000
      max_context_chars: 1000000
      reasoning_effort: high
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: false
      budget_pool: reviewer
      default_service_tier: flex
      fallback_service_tier: null
      max_attempts: 1
      manual_approval_required: false
    emergency_pro_reviewer:
      # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.5-pro to
      # gpt-5 (openai_legacy_reasoning) -- live-verified with a real Flex generation
      # call 2026-08-07 (gpt-5.5-pro was config-validation-only, per the cost policy
      # for expensive emergency roles; gpt-5 is cheaper and was live-verified
      # directly).
      provider: openai
      model_alias: openai_legacy_reasoning
      purpose: manual-approval final adjudication
      max_input_tokens: 128000
      max_output_tokens: 8000
      max_context_chars: 1000000
      reasoning_effort: high
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: false
      budget_pool: emergency
      # Manual-approval-gated (never auto-routed) but still Flex -- the global
      # "no paid request may ever use a non-Flex tier" policy has no exceptions.
      default_service_tier: flex
      fallback_service_tier: null
      max_attempts: 1
      manual_approval_required: true
    legacy_reasoning_fallback:
      # gpt-5 live-verified Flex-capable 2026-08-07.
      provider: openai
      model_alias: openai_legacy_reasoning
      purpose: compatibility fallback only
      max_input_tokens: 64000
      max_output_tokens: 4000
      max_context_chars: 256000
      reasoning_effort: medium
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: true
      budget_pool: builder
      default_service_tier: flex
      fallback_service_tier: null
      max_attempts: 2
      manual_approval_required: false
    mini_legacy_fallback:
      # gpt-5-mini live-verified Flex-capable 2026-08-07.
      provider: openai
      model_alias: openai_mini_legacy
      purpose: compatibility fallback only
      max_input_tokens: 64000
      max_output_tokens: 4000
      max_context_chars: 256000
      reasoning_effort: low
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: false
      budget_pool: builder
      default_service_tier: flex
      fallback_service_tier: null
      max_attempts: 2
      manual_approval_required: false
    non_reasoning_instruction_follower:
      # gpt-4.1 does NOT support Flex -- live-verified 2026-08-07: rejected with
      # "Invalid service_tier argument". No Flex-capable equivalent exists for this
      # role's specific non-reasoning behavior, so live_calls_disabled=true rather
      # than retargeting -- analysis/configuration-only, no override possible.
      provider: openai
      model_alias: openai_non_reasoning
      purpose: deterministic instruction-following fallback (disabled, no Flex support)
      max_input_tokens: 64000
      max_output_tokens: 4000
      max_context_chars: 256000
      reasoning_effort: none
      verbosity: medium
      structured_output: true
      allow_tools: false
      allow_direct_patch: false
      budget_pool: builder
      default_service_tier: default
      fallback_service_tier: null
      max_attempts: 2
      manual_approval_required: false
      live_calls_disabled: true

policies:
  allow_frontier_direct_patch: false
  allow_xhigh_reasoning: false
  allow_emergency_pro_reviewer: false
  builder_execution_backend: role_provider
  # (The strict Flex-only tier policy itself lives in inference.builder_service_tier
  # below and is enforced by AppConfig's config-time validator, not here.)

model_routing:
  trivial: deterministic
  simple: mechanical_worker
  medium: general_builder
  hard: frontier_reviewer
  critical: human-approval

timeouts:
  max_task_runtime_seconds: 600
  max_attempt_runtime_seconds: 300
  max_total_runtime_seconds: 3600

retries:
  max_retries: 1

budget:
  schema_version: 3
  max_task_cost_usd: 0.10
  max_project_cost_usd: 5.0
  stop_threshold_ratio: 0.9
  ledger_path: logs/budget.sqlite
  project_id: default
  project_total_budget_usd: 5.0
  role_budgets_usd:
    worker: 1.0
    builder: 3.0
    reviewer: 1.0
    emergency: 1.0
    mechanical_worker: 1.0
    simple_builder: 3.0
    general_builder: 3.0
    coding_optimized_builder: 3.0
    frontier_reviewer: 1.0
    frontier_coding_reviewer: 1.0
    frontier_balanced_reviewer: 1.0
    classification_worker: 1.0
    emergency_pro_reviewer: 0.5
    legacy_reasoning_fallback: 0.5
    non_reasoning_instruction_follower: 0.5
    mini_legacy_fallback: 0.5

limits:
  max_input_tokens_per_call: 32000
  max_output_tokens_per_call: 4000
  max_context_chars_per_call: 128000
  max_retry_context_chars: 8000
  max_patch_bytes: 256000
  max_stdout_bytes: 256000
  max_stderr_bytes: 64000
  max_validation_output_bytes: 64000
  context_over_limit_policy: reject
  output_over_limit_policy: reject
  validation_output_over_limit_policy: truncate

inference:
  builder_service_tier:
    # Fixed at "flex" -- not configurable to any other tier. Automatically routed
    # calls always request Flex; there is no fallback tier field left to set.
    default_tier: flex
    flex:
      max_attempt_runtime_seconds: 600
      # Bounded Flex-only retries on a transient error (timeout, rate limit,
      # capacity). Every retry still requests Flex. Once exhausted, the task ends
      # with final_status "flex_unavailable" -- never an automatic switch to a
      # higher-priced tier.
      max_flex_retries: 2

convergence:
  max_stagnant_attempts: 2
  max_divergent_attempts: 1
  max_patch_growth_ratio: 1.5
  max_failure_growth_ratio: 1.25
  min_improvement_score_to_continue: -1.0
  hard_stop_on_syntax_regression: true
  hard_stop_on_unrelated_file_touch: true

diagnosis:
  enabled: false
  dry_run: true
  provider: openai
  model: gpt-5
  model_role: frontier_reviewer
  max_input_tokens: 8000
  max_output_tokens: 1500
  max_context_chars: 24000
  max_cost_per_call_usd: 0.25
  max_calls_per_task: 1
  max_calls_per_run: 2
  role_budget_pool: reviewer
  diagnosis_only: true
  max_packet_chars: 24000
  max_diff_chars: 10000
  max_stdout_chars: 4000
  max_stderr_chars: 4000
  allow_direct_patch: false

telegram:
  enabled: false
  bot_token_env_var: TELEGRAM_BOT_TOKEN
  chat_id_env_var: TELEGRAM_CHAT_ID
  missing_env_policy: warn
  notify_on_blocked: true
  notify_on_budget_exhausted: true
  notify_on_runtime_exhausted: true
  notify_on_no_runnable_tasks: true
  notify_on_system_error: true

validation:
  max_files_changed: 5
  forbidden_paths:
    - /etc/
    - ~/.ssh
    - .env
    - secrets
    - credentials
    - tokens
  default_commands:
    - ruff check .
    - mypy .
    - pytest

tool_permissions:
  allowlisted_shell_commands:
    - git
    - pytest
    - ruff
    - mypy
    - python
    - python3
  require_approval_for_delete: true

git:
  require_clean_worktree: false
  preserve_untracked_dirs:
    - logs
    - .cache
    - .pytest_cache
    - .mypy_cache
    - .ruff_cache
  preserve_untracked_files:
    - .gitignore

pricing:
  roles:
    # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.4-nano to
    # gpt-5-nano (same rates as classification_worker:flex, same underlying model).
    # The :default entry was dropped along with gpt-5.4-nano since this role can
    # only ever run on Flex.
    "mechanical_worker:flex":
      provider: openai
      model: gpt-5-nano
      service_tier: flex
      input_usd_per_1m_tokens: 0.025
      cached_input_usd_per_1m_tokens: 0.0025
      output_usd_per_1m_tokens: 0.20
      max_output_tokens: 1500
      budget_pool: worker
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    "classification_worker:flex":
      provider: openai
      model: gpt-5-nano
      service_tier: flex
      input_usd_per_1m_tokens: 0.025
      cached_input_usd_per_1m_tokens: 0.0025
      output_usd_per_1m_tokens: 0.20
      max_output_tokens: 1000
      budget_pool: worker
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    "classification_worker:default":
      provider: openai
      model: gpt-5-nano
      service_tier: default
      input_usd_per_1m_tokens: 0.05
      cached_input_usd_per_1m_tokens: 0.005
      output_usd_per_1m_tokens: 0.40
      max_output_tokens: 1000
      budget_pool: worker
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.4-mini to
    # gpt-5-mini. :default/:priority entries were dropped along with gpt-5.4-mini
    # since this role can only ever run on Flex.
    "simple_builder:flex":
      provider: openai
      model: gpt-5-mini
      service_tier: flex
      input_usd_per_1m_tokens: 0.125
      cached_input_usd_per_1m_tokens: 0.0125
      output_usd_per_1m_tokens: 1.00
      max_output_tokens: 3000
      budget_pool: builder
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.4-mini to
    # gpt-5-mini.
    "general_builder:flex":
      provider: openai
      model: gpt-5-mini
      service_tier: flex
      input_usd_per_1m_tokens: 0.125
      cached_input_usd_per_1m_tokens: 0.0125
      output_usd_per_1m_tokens: 1.00
      max_output_tokens: 6000
      budget_pool: builder
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # coding_optimized_builder was retargeted from gpt-5.3-codex because codex does
    # not support Flex (live-verified 2026-08-07), and simplified 2026-08-07 to the
    # 3-model policy: gpt-5.4-mini -> gpt-5.
    "coding_optimized_builder:flex":
      provider: openai
      model: gpt-5
      service_tier: flex
      input_usd_per_1m_tokens: 0.625
      cached_input_usd_per_1m_tokens: 0.0625
      output_usd_per_1m_tokens: 5.00
      max_output_tokens: 8000
      budget_pool: builder
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.5 to gpt-5
    # (reasoning_effort raised to "high"). :default/:priority entries were dropped
    # along with gpt-5.5 since this role can only ever run on Flex.
    "frontier_reviewer:flex":
      provider: openai
      model: gpt-5
      service_tier: flex
      input_usd_per_1m_tokens: 0.625
      cached_input_usd_per_1m_tokens: 0.0625
      output_usd_per_1m_tokens: 5.00
      max_output_tokens: 8000
      budget_pool: reviewer
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # frontier_coding_reviewer: gpt-5.3-codex, live_calls_disabled=true (no Flex
    # support) -- pricing kept for analysis/cost-estimation reference only.
    "frontier_coding_reviewer:default":
      provider: openai
      model: gpt-5.3-codex
      service_tier: default
      input_usd_per_1m_tokens: 1.75
      cached_input_usd_per_1m_tokens: 0.175
      output_usd_per_1m_tokens: 14.00
      max_output_tokens: 8000
      budget_pool: reviewer
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    "frontier_coding_reviewer:priority":
      provider: openai
      model: gpt-5.3-codex
      service_tier: priority
      input_usd_per_1m_tokens: 3.50
      cached_input_usd_per_1m_tokens: 0.35
      output_usd_per_1m_tokens: 28.00
      max_output_tokens: 8000
      budget_pool: reviewer
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.4 to gpt-5
    # (reasoning_effort raised to "high"). :default/:priority entries were dropped
    # along with gpt-5.4 since this role can only ever run on Flex.
    "frontier_balanced_reviewer:flex":
      provider: openai
      model: gpt-5
      service_tier: flex
      input_usd_per_1m_tokens: 0.625
      cached_input_usd_per_1m_tokens: 0.0625
      output_usd_per_1m_tokens: 5.00
      max_output_tokens: 6000
      budget_pool: reviewer
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # Simplified 2026-08-07 to the 3-model policy: retargeted from gpt-5.5-pro to
    # gpt-5 (live-verified with a real Flex generation call, unlike gpt-5.5-pro
    # which was config-validation-only). :default/:batch entries were dropped along
    # with gpt-5.5-pro since this role can only ever run on Flex.
    "emergency_pro_reviewer:flex":
      provider: openai
      model: gpt-5
      service_tier: flex
      input_usd_per_1m_tokens: 0.625
      cached_input_usd_per_1m_tokens: 0.0625
      output_usd_per_1m_tokens: 5.00
      max_output_tokens: 8000
      budget_pool: emergency
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # legacy_reasoning_fallback: gpt-5, live-verified Flex-capable 2026-08-07.
    "legacy_reasoning_fallback:flex":
      provider: openai
      model: gpt-5
      service_tier: flex
      input_usd_per_1m_tokens: 0.625
      cached_input_usd_per_1m_tokens: 0.0625
      output_usd_per_1m_tokens: 5.00
      max_output_tokens: 4000
      budget_pool: builder
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    "legacy_reasoning_fallback:default":
      provider: openai
      model: gpt-5
      service_tier: default
      input_usd_per_1m_tokens: 1.25
      cached_input_usd_per_1m_tokens: 0.125
      output_usd_per_1m_tokens: 10.00
      max_output_tokens: 4000
      budget_pool: builder
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    # mini_legacy_fallback: gpt-5-mini, live-verified Flex-capable 2026-08-07.
    "mini_legacy_fallback:flex":
      provider: openai
      model: gpt-5-mini
      service_tier: flex
      input_usd_per_1m_tokens: 0.125
      cached_input_usd_per_1m_tokens: 0.0125
      output_usd_per_1m_tokens: 1.00
      max_output_tokens: 4000
      budget_pool: builder
      source_url: https://developers.openai.com/api/docs/pricing
      retrieved_or_verified_date: "2026-05-11"
    "mini_legacy_fallback:default":
      provider: openai
      model: gpt-5-mini
      service_tier: default
      input_usd_per_1m_tokens: 0.25
      cached_input_usd_per_1m_tokens: 0.025
      output_usd_per_1m_tokens: 2.00
      max_output_tokens: 4000
      budget_pool: builder
      source_url: https://developers.openai.com/api/docs/pricing
